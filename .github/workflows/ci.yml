# libwgf's CI: what tools/verify_builds.py runs locally, on Linux, Windows, and the web,
# on every push and pull request (BUILDING.md, "Continuous integration").
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (debug, release, headless, sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libgl1-mesa-dri
          python3 tools/setup_system_packages.py install
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: hxcpp
        run: haxelib install hxcpp 4.3.2 --always --quiet
      - name: Presets, every example headless and in a window, and the binding on hxcpp
        run: >-
          python3 tools/verify_builds.py --only
          linux-x64-debug-headless,linux-x64-debug,linux-x64-release,linux-x64-debug-ubsan,linux-x64-debug-asan,linux-x64-debug-tsan,smoke,desktop,binding,features,cli,games

  web:
    name: web (wasm32 debug and release, node and Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The pinned Emscripten
        id: pins
        run: echo "emscripten=$(head -n1 cmake/emscripten-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: emsdk-cache
          key: emsdk-${{ steps.pins.outputs.emscripten }}-${{ runner.os }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.pins.outputs.emscripten }}
          actions-cache-folder: emsdk-cache
      - name: Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: TypeScript, for the JS binding's type test (the version tools/check_js_binding.py pins)
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0, "tools"); import check_js_binding as c; print(c.TYPESCRIPT)')
          npm install -g "typescript@$version"
      - name: Presets, every example in Chrome, both bindings under node and in Chrome
        run: python3 tools/verify_builds.py --web --only wasm32-debug-headless,wasm32-debug,wasm32-release,web,binding-web,features-web,js-binding,cli,games,sizes

  windows:
    name: windows (MSVC debug, headless, release)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: hxcpp
        run: haxelib install hxcpp 4.3.2 --always --quiet
      - name: Presets, every example headless, and the binding on hxcpp
        run: python tools/verify_builds.py --only windows-x64-msvc-debug-headless,windows-x64-msvc-debug,windows-x64-msvc-release,smoke,binding,features
      # headless only: the runner has no GPU, so no OpenGL 4.1 for a window (sokol's GL core);
      # a game's desktop export runs in a window on Windows in tools/verify_builds.py --windows
      - name: Every game's playthrough, headless
        run: python tools/check_games.py --only generated,playthrough
