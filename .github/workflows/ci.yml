# libwgf's CI on each push and pull request: the builds and tests on Linux, Windows' MSVC
# debug build, the web's two builds, and every example in a browser and both bindings, each
# job a check of tools/verify_builds.py's (checks.yml has the jobs); about 8 minutes. A push
# or pull request of docs alone runs nothing (CONVENTIONS.md, "Verifying"; BUILDING.md,
# "Continuous integration").
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      linux: |
        [
          {"name": "debug (headless and windowed, every example headless and in a window, the binding on hxcpp)",
           "key": "debug", "steps": "linux-x64-debug-headless,linux-x64-debug,smoke,desktop,binding,features"},
          {"name": "release (release and release-headless, the wgf tool, the games, the Haxe examples)",
           "key": "release", "steps": "linux-x64-release,linux-x64-release-headless,cli,games,haxe-examples"},
          {"name": "sanitizers (ubsan, asan, tsan)",
           "key": "sanitizers", "steps": "linux-x64-debug-ubsan,linux-x64-debug-asan,linux-x64-debug-tsan"}
        ]
      web: |
        [
          {"name": "wasm32 debug (headless and in Chrome)", "key": "debug",
           "run": "python3 tools/verify_builds.py --web --only wasm32-debug-headless,wasm32-debug"},
          {"name": "wasm32 release", "key": "release", "run": "python3 tools/verify_builds.py --web --only wasm32-release"},
          {"name": "in Chrome and node (every example, both bindings, the JS examples, the wgf tool)", "key": "checks",
           "run": "python3 tools/verify_builds.py --web --only web,binding-web,features-web,js-binding,cli", "typescript": true}
        ]
      windows: |
        [
          {"name": "MSVC debug", "steps": "windows-x64-msvc-debug"}
        ]
