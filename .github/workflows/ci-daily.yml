# libwgf's slower CI, daily and on demand (gh workflow run ci-daily, or the Actions tab): the
# games, the web sizes, the frames, and Windows' MSVC debug-headless and release jobs, each a
# check of tools/verify_builds.py's (checks.yml has the jobs). What each push runs is ci.yml
# (BUILDING.md, "Continuous integration").
name: ci-daily

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

concurrency:
  group: ci-daily
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      # the racer's frames unthrottled: CI keeps the benchmark working and records nothing
      # (Rob's, 2026-10-12); 4x on SwiftShader made it the run's long pole
      web: |
        [
          {"name": "games, asteroids", "key": "games-asteroids", "run": "python3 tools/check_games.py asteroids"},
          {"name": "games, the racer in Chrome", "key": "games-racer-browser",
           "run": "python3 tools/check_games.py --only browser racer"},
          {"name": "games, the racer's export", "key": "games-racer",
           "run": "python3 tools/check_games.py --only generated,playthrough,web,desktop racer"},
          {"name": "sizes, 1 of 3", "key": "sizes-1", "run": "python3 tools/measure_sizes.py --check --shard 1/3"},
          {"name": "sizes, 2 of 3", "key": "sizes-2", "run": "python3 tools/measure_sizes.py --check --shard 2/3"},
          {"name": "sizes, 3 of 3", "key": "sizes-3", "run": "python3 tools/measure_sizes.py --check --shard 3/3"},
          {"name": "frames, asteroids", "key": "frames-asteroids",
           "run": "python3 tools/bench/measure_frames.py --display headless game:asteroids"},
          {"name": "frames, the racer", "key": "frames-racer",
           "run": "python3 tools/bench/measure_frames.py --display headless --throttle 1 game:racer"}
        ]
      windows: |
        [
          {"name": "MSVC debug-headless (every example headless, the binding on hxcpp, each game's playthrough, the wgf launcher)",
           "steps": "windows-x64-msvc-debug-headless,smoke,binding,features", "more": true},
          {"name": "MSVC release", "steps": "windows-x64-msvc-release"}
        ]
