<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>asteroids</title>
<!-- A Haxe program's page, written from hosts/web/page.html: it loads libwgf's web host,
     wgf-host.js and .wasm (tools/build_host.py), makes the host on the canvas, and then
     the program, asteroids.js, built by Haxe for the JS target, which finds the host
     at globalThis.wgfHost (wgf.Runtime.run). Files are versioned name?v=<hash> once
     stamped in (the /*wgf:versions*/ mark below), so a host can keep them for good. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101218;
    color: #cdd3de; font: 14px/1.4 system-ui, sans-serif; }
  /* the canvas fills the page; sokol manages the drawing buffer. Touches on it are the
     program's: the browser doesn't scroll or zoom the page for them. dvh is the visible
     height, without a phone's browser bars; vh before it is the fallback. */
  #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
    background: #000; outline: none; touch-action: none; }
  #status { position: fixed; left: 10px; bottom: 8px; z-index: 10; color: #7b8494; pointer-events: none; }
  /* A console on the page, because a phone has no easy one: what the program logs, and
     anything the browser refuses to do. Opens itself on the first error. */
  #log { position: fixed; inset: auto 0 0 0; max-height: 45vh; z-index: 11; display: none;
    overflow-y: auto; padding: 6px 10px; margin: 0; background: #0b0d11ee;
    border-top: 1px solid #2c313c; font: 12px/1.45 ui-monospace, monospace;
    white-space: pre-wrap; overscroll-behavior: contain; }
  #log.on { display: block; }
  #log .warn { color: #ffcc66; }
  #log .err  { color: #ff8080; }
  #logbtn { position: fixed; right: 10px; top: 8px; z-index: 12; background: #0f1115aa; color: #cdd3de;
    border: 1px solid #3a4150; border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer; }
  #logbtn.alert { border-color: #ff8080; color: #ff8080; }
</style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <span id="status">loading…</span>
  <button id="logbtn" type="button">console</button>
  <pre id="log"></pre>
  <script type="module">
    const NAME = "asteroids";
    const statusEl = document.getElementById("status");

    // ---- console on the page --------------------------------------------------
    const logEl = document.getElementById("log");
    const logBtn = document.getElementById("logbtn");
    const MAX_LINES = 400;
    function addLine(text, kind) {
      const line = document.createElement("span");
      line.className = kind || "";
      line.textContent = text + "\n";
      logEl.appendChild(line);
      while (logEl.childNodes.length > MAX_LINES) logEl.removeChild(logEl.firstChild);
      logEl.scrollTop = logEl.scrollHeight;
      if (kind) logBtn.classList.add("alert");
      if (kind === "err" && !logEl.classList.contains("on")) logEl.classList.add("on");
    }
    logBtn.addEventListener("click", () => {
      logEl.classList.toggle("on");
      if (logEl.classList.contains("on")) logBtn.classList.remove("alert");
    });
    // libwgf writes every level to stderr, which emscripten sends to printErr, so the
    // level has to come from the line itself: "[WARN ] wgf_mesh.c:12: ..."
    const LEVEL = /^\[(TRACE|DEBUG|INFO|WARN|ERROR|FATAL)\s*\]/;
    function levelKind(text) {
      const m = LEVEL.exec(text);
      if (!m) return null;
      return (m[1] === "ERROR" || m[1] === "FATAL") ? "err" : m[1] === "WARN" ? "warn" : "";
    }
    for (const [name, kind] of [["log", ""], ["info", ""], ["warn", "warn"], ["error", "err"]]) {
      const original = console[name].bind(console);
      console[name] = (...a) => {
        original(...a);
        addLine(a.map(v => (typeof v === "string" ? v : String(v))).join(" "), kind);
      };
    }
    addEventListener("error", e => addLine("error: " + (e.message || e.type), "err"));
    addEventListener("unhandledrejection", e => addLine("unhandled: " + e.reason, "err"));
    if (new URLSearchParams(location.search).get("console") === "1" || location.hash === "#console") {
      logEl.classList.add("on");
    }

    // ---- the host, then the program ------------------------------------------
    // Written in by the build: {"host": "<hash>", "wasm": "<hash>", "js": "<hash>"}, so
    // each file is loaded as name?v=<hash>; empty, they are loaded unversioned.
    const VERSION = /*wgf:versions*/{};
    const versioned = (file, hash) => (hash ? file + "?v=" + hash : file);

    // What this build needs from the browser, said plainly: a missing WebGL2 is a blank
    // canvas otherwise.
    const missing = (() => {
      if (!window.WebAssembly) return "WebAssembly";
      const canvas = document.createElement("canvas");
      if (!canvas.getContext("webgl2")) return "WebGL2";
      return null;
    })();
    if (missing) {
      statusEl.textContent = "this browser has no " + missing + ", which this program needs";
      throw new Error("missing " + missing);
    }

    // libwgf writes every level to stderr, which arrives here a line at a time
    const printErr = (...a) => {
      const text = a.join(" ");
      const kind = levelKind(text);
      if (kind === "err") console.error(text);
      else if (kind === "warn") console.warn(text);
      else console.log(text);
    };
    try {
      const createWgfHost = (await import(versioned("./wgf-host.js", VERSION.host))).default;
      globalThis.wgfHost = await createWgfHost({
        canvas: document.getElementById("canvas"),
        print: (...a) => console.log(...a),
        printErr,
        locateFile: (path, prefix) => (path.endsWith(".wasm") ? versioned("wgf-host.wasm", VERSION.wasm) : prefix + path),
        // a scripted run (the wgf tool's play, a playthrough), when one was handed the page
        ...(typeof globalThis.wgfScript === "string" ? { wgfScript: globalThis.wgfScript } : {}),
      });
      statusEl.textContent = "";
      await import(versioned("./" + NAME + ".js", VERSION.js));
    } catch (err) {
      statusEl.textContent = "failed to start: " + (err && err.message ? err.message : err);
      console.error("page:", err);
    }
  </script>
</body>
</html>
